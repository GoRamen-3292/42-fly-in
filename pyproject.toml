[project]
name = "fly-in"
version = "0.1.0"
description = "This project has been created as part of the 42 curriculum by ktomita."
readme = "README.md"
authors = [
    { name = "ktomita", email = "ktomita@student.42tokyo.jp" }
]
requires-python = ">=3.14,<3.16"
dependencies = [
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
]

[project.scripts]
fly-in = "fly_in:main"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
    "test",
]
pythonpath = [
  "."
]

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "mypy>=2.4.1",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "ANN",     # 型注釈
    "B",       # bugbear
    "D",       # docstring
    "C4",      # comprehensions
    "SIM",     # simplify
    "RET",     # return
    "PL",      # pylint
    "TRY",     # tryceratops
    "PERF",    # perflint
    "PT",      # pytest
    "ERA",     # コメントアウトされたコード
    "RUF",     # ruff独自
]

ignore = [
    "D415",    # 日本語のDocStringであるため、末尾の文字を規定するためのルールを無視する
    "ANN401",  # 型注釈の型が不明な場合に警告を出すルールを無視
    "TRY003",  # 長いexceptionへのメッセージを無視
    "TRY301",  # raise文の関数への分離についてのメッセージを無視
    "PLR2004",  # マジックナンバーでの比較を許容
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"test/**" = ["E501", "D"]
"sandbox/**" = ["ALL"]
