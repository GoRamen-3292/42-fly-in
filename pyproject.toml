[project]
name = "fly-in"
version = "0.1.0"
description = "This project has been created as part of the 42 curriculum by ktomita."
readme = "README.md"
authors = [
    { name = "ktomita", email = "ktomita@student.42tokyo.jp" }
]
requires-python = ">=3.14,<3.16"
dependencies = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
]

[project.scripts]
fly-in = "fly_in:main"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
    "test",
]
pythonpath = [
  "."
]
